name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Go and web source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Format, vet, test, and JS syntax
        run: |
          gofmt -d cmd/jukebox/*.go cmd/ma-probe/*.go internal/musicassistant/*.go
          test -z "$(gofmt -l cmd/jukebox/*.go cmd/ma-probe/*.go internal/musicassistant/*.go)"
          git diff --check
          go vet ./...
          go test -race ./...
          node --check cmd/jukebox/web/app.js
          node --test tests/*.test.mjs
